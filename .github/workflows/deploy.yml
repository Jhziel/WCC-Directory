name: Laravel Auto-Deploy

on:
  push:
    branches:
      - main  # deploy when main branch is pushed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git reset --hard
            git pull origin main
            /usr/local/lsws/lsphp83/bin/php $(which composer) install --no-interaction --prefer-dist --optimize-autoloader
            /usr/local/lsws/lsphp83/bin/php artisan migrate --force
            /usr/local/lsws/lsphp83/bin/php artisan config:cache
            /usr/local/lsws/lsphp83/bin/php artisan route:cache
            /usr/local/lsws/lsphp83/bin/php artisan view:cache
            echo "✅ Deployment completed"